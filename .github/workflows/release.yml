name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv build

      - name: Verify the distribution
        run: uv run --no-project python .github/scripts/verify_dist.py

      # A tag that disagrees with pyproject.toml produces a release nobody can
      # find, and PyPI will not let the version be reused.
      - name: Check the tag matches the packaged version
        run: uv run --no-project python .github/scripts/check_tag.py "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    # After PyPI, deliberately. A PyPI version cannot be replaced, only
    # superseded, whereas a GitHub release can be edited or deleted -- so the
    # irreversible step goes first, and the release only appears if it worked.
    needs: pypi-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are generated from the history since the last tag.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Composed explicitly rather than passing both --notes-file and
      # --generate-notes, whose precedence is not documented: the hand-written
      # section is the part worth keeping, so it must not depend on which flag
      # gh decides wins.
      - name: Assemble the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/extract_changelog.py "${GITHUB_REF_NAME#v}" > notes.md
          printf '\n' >> notes.md
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq '.body' >> notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/*
